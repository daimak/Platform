<style>

  html,body{margin:0;padding:0}
  body{background:#080b10;color:#e8e2d0;font-family:system-ui,"Segoe UI",sans-serif}
  .frame{max-width:1280px;margin:0 auto;height:720px;display:flex;flex-direction:column;background:#0d1218;border-left:1px solid #141b24;border-right:1px solid #141b24}
  header{display:flex;align-items:center;gap:18px;padding:12px 20px 11px;border-bottom:1px solid #1a232e;flex:none}
  .ttl h1{margin:0;font-size:27px;font-weight:650;letter-spacing:.5px;color:#e8e2d0;line-height:1.1}
  .status{font-size:10.5px;letter-spacing:2px;color:#7f92a6;margin-top:3px}
  .chips{display:flex;gap:8px;margin-left:auto}
  .chip{display:flex;align-items:baseline;gap:6px;border:1px solid #2b3844;border-radius:8px;padding:4px 10px;background:#10161d}
  .chip i{font-style:normal;font-size:10.5px;color:#7f92a6;letter-spacing:.4px}
  .chip b{font-size:15px;color:#d9822b;font-variant-numeric:tabular-nums}
  .home{width:36px;height:36px;border-radius:50%;border:1px solid #2b3844;background:#12181f;color:#e8e2d0;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:17px;flex:none;line-height:1}
  .home:hover{border-color:#7fd4ff;color:#7fd4ff}
  main{flex:1;min-height:0;display:flex}
  .scene{flex:1;min-width:0}
  .scene svg{display:block;width:100%;height:100%}
  .panel{width:320px;flex:none;border-left:1px solid #1a232e;padding:18px 20px;overflow:auto;background:#0b1016}
  .p-kind{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#7fd4ff}
  .panel h2{margin:6px 0 12px;font-size:19px;line-height:1.25;color:#e8e2d0}
  .stage{display:inline-block;font-size:11.5px;padding:3px 10px;border-radius:6px;border:1px solid;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .st-bp{background:rgba(232,226,208,.1);color:#e8e2d0;border-color:rgba(232,226,208,.4)}
  .st-keel{background:rgba(138,106,68,.18);color:#c9a06a;border-color:rgba(138,106,68,.55)}
  .st-launch{background:rgba(127,212,255,.1);color:#7fd4ff;border-color:rgba(127,212,255,.45)}
  .st-mid{background:rgba(90,106,122,.15);color:#9fb3c8;border-color:rgba(90,106,122,.5)}
  .sec{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:#7f92a6;margin:14px 0 6px;border-top:1px solid #18212c;padding-top:10px}
  .panel ul{list-style:none;margin:0;padding:0;font-size:13px;color:#b8c6d4;line-height:1.5}
  .panel ul li{padding-left:14px;position:relative;margin-bottom:4px}
  .panel ul li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;background:#d9822b}
  .phrase{margin-top:16px;padding:10px 12px;border-left:3px solid #8a6a44;background:#10161d;color:#d9d3c0;font-style:italic;font-size:13px;line-height:1.5}
  .hot{cursor:pointer;transition:filter .15s}
  .hot:hover{filter:brightness(1.25)}
  .hot.sel{filter:brightness(1.12) drop-shadow(0 0 6px rgba(127,212,255,.4))}
  .arc{animation:weld 2.3s linear infinite}
  .arc.b{animation-delay:1.15s}
  @keyframes weld{0%,40%{opacity:0}44%,50%{opacity:1}47%{opacity:.25}54%,62%{opacity:.85}68%,100%{opacity:0}}
</style>
