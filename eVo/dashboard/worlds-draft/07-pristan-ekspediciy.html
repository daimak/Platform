<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пристань Экспедиций</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(1100px 520px at 50% -140px, #0e1e30, #0a1420);
    color: #d9c9a8;
    font-family: system-ui, 'Segoe UI', sans-serif;
  }
  header {
    max-width: 1280px; margin: 0 auto;
    display: flex; align-items: center; gap: 20px;
    padding: 14px 22px 10px;
    border-bottom: 1px solid #1c3a52;
  }
  h1 { margin: 0; font-size: 26px; font-weight: 600; letter-spacing: .4px; color: #ecdfc2; }
  .sub { font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase; color: #7fa0b8; margin-top: 3px; }
  .chips { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; }
  .chip {
    display: flex; align-items: baseline; gap: 7px;
    border: 1px solid #23405a; background: #0d1a28;
    border-radius: 6px; padding: 5px 10px;
  }
  .chip span { font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase; color: #8fa8bd; }
  .chip b { font-size: 15px; color: #c98a3d; font-variant-numeric: tabular-nums; }
  .home {
    width: 34px; height: 34px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid rgba(201,138,61,.45);
    background: #0d1a28; color: #c98a3d;
    font-size: 17px; text-decoration: none; line-height: 1;
  }
  .home:hover { border-color: #c98a3d; background: rgba(201,138,61,.14); }
  main {
    max-width: 1280px; margin: 0 auto;
    display: flex; gap: 16px;
    padding: 12px 22px 16px;
  }
  .scene { flex: 1; min-width: 0; }
  .scene svg { width: 100%; height: auto; display: block; }
  .panel {
    flex: 0 0 320px; align-self: flex-start;
    background: #0d1a28; border: 1px solid #23405a;
    border-radius: 10px; padding: 16px 18px 14px;
  }
  .p-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; border-bottom: 1px solid #23405a; padding-bottom: 12px; }
  .p-name { font-size: 15.5px; font-weight: 600; color: #ecdfc2; line-height: 1.3; }
  .p-kind { font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; color: #8fa8bd; margin-top: 4px; }
  .p-stamp {
    flex: 0 0 auto; margin-top: 2px;
    font-size: 9.5px; font-weight: 700; letter-spacing: 1px; white-space: nowrap;
    border: 1px solid; border-radius: 20px; padding: 4px 9px;
  }
  .p-sec { margin-top: 12px; }
  .p-h { font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; color: #c98a3d; margin-bottom: 5px; }
  .p-kv { display: flex; gap: 8px; padding: 2px 0; font-size: 12.5px; line-height: 1.45; }
  .p-kv span { flex: 0 0 42%; max-width: 42%; color: #9fb6c9; }
  .p-kv b { font-weight: 500; color: #e6d9ba; font-variant-numeric: tabular-nums; }
  .p-phrase {
    margin-top: 14px; padding: 6px 0 6px 10px;
    border-left: 2px solid #c98a3d;
    font-style: italic; font-size: 12.5px; color: #d9c9a8;
  }
  /* сцена */
  .obj { cursor: pointer; outline: none; }
  .obj:hover, .obj:focus-visible { filter: brightness(1.35); }
  .bob { animation: bob 4.5s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  .route { stroke-dasharray: 4 7; animation: flow 16s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -132; } }
  .scene text, .panel { user-select: text; }
  @media (max-width: 1000px) {
    main { flex-direction: column; }
    .panel { flex: 1 1 auto; width: 100%; }
  }
</style>
</head>

        { h: 'Бюджеты', kv: [['выдача', 'по экспедициям'], ['правило', 'бюджет + рапорт']] },
        { h: 'Врата', kv: [['выход', 'без рапорта экспедиция закрыта']] }
      ],
      phrase: 'Без рапорта — ни один борт не уходит.'
    },
    vb: {
      name: 'Труба вахты', kind: 'вахта пристани',
      stamp: 'ВАХТА', c: '#c98a3d',
      secs: [
        { h: 'Капитан', kv: [['имя', 'Синдбад'], ['паспорт', 'Memory/Agents/Sindbad.md']] },
        { h: 'Рантайм', kv: [['тело', 'нет — пристань и есть его стапель']] },
        { h: 'Сигнал', kv: [['труба', 'к отплытию и к встрече']] }
      ],
      phrase: 'Тела нет — есть бюджет, рапорт и море.'
    },
    ds: {
      name: 'Доска статусов', kind: 'сводка пристани',
      stamp: 'СВОДКА', c: '#c98a3d',
      secs: [
        { h: 'Готов к отплытию — 2', kv: [['Деньги-рейн', 'на стапеле'], ['Внешние связи В-1..В-4', 'на стапеле']] },
        { h: 'В море — 1', kv: [['Dark Watch', 'onion-наблюдение']] },
        { h: 'Вернулся с грузом — 1', kv: [['Tor-разведка', 'груз сдан']] }
      ],
      phrase: 'Два снаряжаются, один в море, один груз сдал.'
    }
  };

  function render(id) {
    var d = DATA[id];
    if (!d) return;
    var html = '<div class="p-head"><div><div class="p-name">' + d.name + '</div>' +
      '<div class="p-kind">' + d.kind + '</div></div>' +
      '<span class="p-stamp" style="color:' + d.c + ';border-color:' + d.c + ';background:' + d.c + '1a">' + d.stamp + '</span></div>';
    for (var i = 0; i < d.secs.length; i++) {
      var s = d.secs[i];
      html += '<div class="p-sec"><div class="p-h">' + s.h + '</div>';
      for (var j = 0; j < s.kv.length; j++) {
        html += '<div class="p-kv"><span>' + s.kv[j][0] + '</span><b>' + s.kv[j][1] + '</b></div>';
      }
      html += '</div>';
    }
    html += '<div class="p-phrase">' + d.phrase + '</div>';
    document.getElementById('panel').innerHTML = html;
  }

  var objs = document.querySelectorAll('.obj');
  for (var k = 0; k < objs.length; k++) {
    (function (el) {
      var go = function () { render(el.getAttribute('data-id')); };
      el.addEventListener('click', go);
      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    })(objs[k]);
  }

  render('dw');
</script>
</body>
