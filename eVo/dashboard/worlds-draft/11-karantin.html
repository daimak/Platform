<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Карантинная Гавань</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{height:100vh;display:flex;flex-direction:column;background:#0a1420;color:#e8dcc4;font-family:'Segoe UI',system-ui,sans-serif;min-width:1240px;overflow-x:hidden;overflow-y:auto}

/* ── шапка ── */
header{display:flex;align-items:center;gap:20px;padding:12px 24px 11px;border-bottom:1px solid #1b2c3d;background:linear-gradient(180deg,#0e1c2c,#0a1420);flex:0 0 auto}
.ttl h1{margin:0;font-size:25px;font-weight:700;letter-spacing:.4px;color:#e8dcc4}
.status{font-size:10.5px;color:#7f94a8;letter-spacing:1.8px;text-transform:uppercase;margin-top:3px}
.chips{display:flex;gap:9px;margin-left:auto}
.chip{display:flex;align-items:baseline;gap:9px;background:rgba(217,201,168,.06);border:1px solid #24384e;border-radius:6px;padding:7px 13px}
.chip span{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8fa5bb}
.chip b{font-size:16px;color:#e8dcc4;font-family:Consolas,'Courier New',monospace;font-variant-numeric:tabular-nums;line-height:1}
.home{width:38px;height:38px;border-radius:50%;border:1px solid #2a3f55;background:rgba(217,201,168,.07);color:#e8dcc4;font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;text-decoration:none;margin-left:6px;flex:0 0 auto;transition:background .2s,border-color .2s}
.home:hover{background:rgba(217,201,168,.16);border-color:#d9c9a8}

/* ── каркас ── */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 402px}
.scene{position:relative;min-width:0;overflow:hidden;background:linear-gradient(180deg,#04090f 0%,#142739 60%,#0d1c2b 60.5%,#05090f 100%)}
.scene svg{width:100%;height:100%;display:block;font-family:'Segoe UI',system-ui,sans-serif}
.panel{position:relative;overflow-y:auto;background:linear-gradient(168deg,#efe3cb,#e2d2b0);padding:22px 26px 28px;box-shadow:-10px 0 26px rgba(0,0,0,.5)}
.panel::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:rgba(93,74,44,.28)}

/* ── досье (бумага) ── */
.pk{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#6b5a38}
.stamp{border:2.5px solid;border-radius:4px;padding:5px 12px;font:700 13.5px 'Courier New',monospace;letter-spacing:2.5px;text-transform:uppercase;transform:rotate(-6deg);white-space:nowrap;opacity:.95;box-shadow:inset 0 0 0 1.5px rgba(29,39,51,.1),0 1px 3px rgba(29,39,51,.18);font-variant-numeric:tabular-nums}
.st-amber{color:#7d5217;border-color:#7d5217}
.st-green{color:#1e6b45;border-color:#1e6b45}
.st-rust{color:#8f2f28;border-color:#8f2f28}
.st-ink{color:#55462a;border-color:#55462a}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel h2{margin:14px 0 4px;font-size:27px;color:#1d2733;letter-spacing:.3px}
.pass{font:12px/1.5 Consolas,'Courier New',monospace;color:#6b5a38;background:rgba(93,74,44,.09);border:1px dashed rgba(93,74,44,.4);border-radius:4px;padding:6px 10px;margin:8px 0 2px;word-break:break-all}
.row{display:flex;gap:14px;padding:10px 0;border-bottom:1px dashed rgba(93,74,44,.35)}
.row span{flex:0 0 96px;font-size:10px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:#6b5a38;padding-top:3px}
.row p{margin:0;flex:1;font-size:13.5px;line-height:1.5;color:#1d2733}

/* ── сцена ── */
[data-ship]{cursor:pointer;transition:filter .25s}
[data-ship]:hover{filter:brightness(1.35)}
.sel{filter:brightness(1.3)}
.hull{fill:#0f1d2c;stroke:#31506e;stroke-width:1;transition:stroke .2s}
.ship:hover .hull,.ship.sel .hull{stroke:#d9c9a8}
.ship.sel .sname{fill:#e8dcc4}
.mast{stroke:#31506e;stroke-width:1.4}
.anchorl{stroke:#24384e;stroke-width:1.2;fill:none}
.crate{fill:#1d3145;stroke:#2a3f55;stroke-width:.8}
.wake{fill:#1b3040;opacity:.3}
.sname{fill:#9fb3c8;font-weight:600;letter-spacing:.4px}
.lamp.a{fill:#d9c9a8}.lamp.g{fill:#68d391}.lamp.w{fill:#dfe7ee}
.glow{opacity:.2}
.glow.a{fill:#d9c9a8}.glow.g{fill:#68d391}.glow.w{fill:#dfe7ee}
.lamp{animation:flick 5s infinite}
@keyframes flick{0%,100%{opacity:1}9%{opacity:.55}13%{opacity:.95}47%{opacity:.8}}
.bob{animation:bob 5.6s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(-1.5px)}to{transform:translateY(1.7px)}}
#beamRot{transform-box:view-box;transform-origin:91px 135px;animation:sweep 12s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-13deg)}to{transform:rotate(12deg)}}
.fogA{animation:drift 36s ease-in-out infinite alternate}
.fogB{animation:drift 28s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-28px)}to{transform:translateX(28px)}}
.sign{font-weight:700;font-size:11px;letter-spacing:1.6px;text-anchor:middle}
.sign2{font-weight:600;font-size:9.5px;letter-spacing:.8px;text-anchor:middle}
.gtxt{fill:#68d391}.gtxt2{fill:#68d391;opacity:.72}
.rtxt{fill:#d9534f}.rtxt2{fill:#d9534f;opacity:.72}
.ptxt{fill:#e8dcc4}
.dtxt{fill:#8fa5bb}
.stone{stroke:#1c2e40;stroke-width:1;opacity:.5}
.wave{stroke:#22384a;stroke-width:1;fill:none;opacity:.5}
</style>
</head>

/* ── постройка судов ── */
var GB=document.getElementById('fleetBack');
var GF=document.getElementById('fleetFront');
var GQ=document.getElementById('quayShips');

function ship(o){
  var g=el('g',{class:'ship','data-ship':o.id,transform:'translate('+o.x+' '+o.y+') scale('+o.s+')'},o.g);
  var b=el('g',{class:'bob'},g);
  b.style.animationDelay=((o.x%7)*0.55).toFixed(2)+'s';
  el('ellipse',{cx:23,cy:12.5,rx:20,ry:3,class:'wake'},b);
  el('line',{x1:23,y1:0,x2:23,y2:-24,class:'mast'},b);
  el('circle',{cx:23,cy:-24,r:5.5,class:'glow '+o.lamp},b);
  var lamp=el('circle',{cx:23,cy:-24,r:2.2,class:'lamp '+o.lamp},b);
  lamp.style.animationDelay=((o.x%5)*0.9).toFixed(2)+'s';
  if(o.barge){el('rect',{x:12,y:-13,width:15,height:10,class:'crate'},b);}
  el('path',{d:'M0 0 L46 0 L40 10 L6 10 Z',class:'hull'},b);
  if(!o.moored){el('path',{d:'M10 10 Q8 19 4 22',class:'anchorl'},b);}
  var t=el('text',{x:23,y:o.ny,'text-anchor':'middle',class:'sname','font-size':(o.s<1?14:11)},b);
  t.textContent=o.name;
  return g;
}

/* ── панель досье ── */
function render(id){
  var d=DB[id]||DB.overview;
  var sel=document.querySelectorAll('.sel');
  for(var i=0;i<sel.length;i++){sel[i].classList.remove('sel');}
  var node=document.querySelector('[data-ship="'+id+'"]');
  if(node){node.classList.add('sel');}
  var h='<div class="ptop"><span class="pk">'+d.tag+'</span><span class="stamp st-'+d.tone+'">'+d.stamp+'</span></div>';
  h+='<h2>'+d.name+'</h2>';
  if(d.pass){h+='<div class="pass">'+d.pass+'</div>';}
  for(var j=0;j<d.rows.length;j++){
    h+='<div class="row"><span>'+d.rows[j][0]+'</span><p>'+d.rows[j][1]+'</p></div>';
  }
  panel.innerHTML=h;
}

document.getElementById('scene').addEventListener('click',function(e){
  var t=e.target.closest('[data-ship]');
  if(t){render(t.getAttribute('data-ship'));}
});

render('overview');
})();
