var st=document.getElementById('pStatus');
st.textContent=d.status;
st.className='st '+d.cls;
document.getElementById('pName').textContent=d.name;
var rows=document.getElementById('pRows');
rows.innerHTML='';
d.rows.forEach(function(r){
var div=document.createElement('div');
div.className='row';
var s=document.createElement('span');s.textContent=r[0];
var b=document.createElement('b');b.textContent=r[1];
div.appendChild(s);div.appendChild(b);
rows.appendChild(div);
});
document.getElementById('pQuote').textContent=d.quote;
if(cur){var prev=document.querySelector('[data-id="'+cur+'"]');if(prev)prev.classList.remove('on');}
cur=id;
var sel=document.querySelector('[data-id="'+id+'"]');
if(sel)sel.classList.add('on');
}
document.getElementById('scene').addEventListener('click',function(e){
var t=e.target.closest?e.target.closest('[data-id]'):null;
if(t)render(t.getAttribute('data-id'));
});
render('kontora');
})();
</script>
</body>
</html>
