<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Туманный Архипелаг — Platform Evo · превью-вариация</title>
<style>
:root{--teal:#4fd1c5;--amber:#b3a476;--ink:#c7d5e2;--dim:#7e94a8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#060d15;overflow-x:hidden}
body{font-family:"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink)}
header{display:flex;align-items:center;gap:16px;padding:14px 22px 10px;max-width:1324px;margin:0 auto}
.ttl h1{font-size:26px;font-weight:600;margin:0;letter-spacing:.02em;color:#eaf2f8}
.ttl .sub{font-size:11px;letter-spacing:.14em;color:var(--dim);margin-top:3px}
.chips{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
.chip{display:flex;align-items:baseline;gap:7px;padding:5px 12px;border:1px solid rgba(79,209,197,.18);border-radius:999px;background:rgba(34,56,74,.35)}
.chip .cl{font-size:11px;color:var(--dim);white-space:nowrap}
.chip .cv{font-size:14px;font-weight:600;color:#eaf2f8;font-variant-numeric:tabular-nums}
.home{width:40px;height:40px;border-radius:50%;border:1px solid rgba(79,209,197,.35);background:rgba(10,20,32,.85);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;text-decoration:none;flex:none}
.home:hover{border-color:var(--teal);color:var(--teal)}
.stage{position:relative;max-width:1280px;margin:0 auto;border:1px solid rgba(79,209,197,.12);border-radius:16px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.panel{position:absolute;top:84px;right:16px;width:330px;background:rgba(8,16,26,.92);border:1px solid rgba(79,209,197,.22);border-radius:14px;padding:16px 18px}
.p-name{font-size:17px;font-weight:600;color:#eaf2f8}
.p-status{font-size:11px;letter-spacing:.1em;margin-top:4px;text-transform:uppercase}
.p-status.ok{color:var(--teal)}
.p-status.dim{color:var(--amber)}
.p-status.dark{color:var(--dim)}
.p-rows{margin-top:12px;border-top:1px solid rgba(126,148,168,.18);padding-top:10px}
.p-row{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.p-row span{font-size:11px;color:var(--dim)}
.p-row b{font-size:12.5px;font-weight:600;color:#dce8f2;font-variant-numeric:tabular-nums;text-align:right}
.p-phrase{margin-top:12px;font-size:13px;line-height:1.45;color:#a8c3d4}
.p-check{margin-top:10px;font-size:10.5px;letter-spacing:.06em;color:#6d8296}
.lbl{font-size:12.5px;fill:#9db4c8;transition:fill .2s}
.lbl.teal{fill:var(--teal)}
.lbl.amber{fill:var(--amber)}
.lbl.sm{font-size:10.5px}
.lbl2{font-size:10.5px;fill:#7e94a8;letter-spacing:.04em}
.obj{cursor:pointer}
.obj:hover .lbl{fill:#eaf2f8}
.obj.sel .lbl{fill:var(--teal)}
.obj .hit{fill:transparent;pointer-events:all}
.obj.sel .hit{stroke:rgba(79,209,197,.5);stroke-width:1;stroke-dasharray:4 4;fill:rgba(79,209,197,.04)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@keyframes pulse{0%,100%{opacity:.18}50%{opacity:.34}}
@keyframes driftA{from{transform:translateX(-50px)}to{transform:translateX(70px)}}
@keyframes driftB{from{transform:translateX(60px)}to{transform:translateX(-70px)}}
@keyframes wisp{from{transform:translateX(-350px)}to{transform:translateX(1650px)}}
@keyframes watch{0%,100%{transform:translate(0,0);opacity:.5}50%{transform:translate(40px,8px);opacity:.85}}
.island-main{animation:bob 12s ease-in-out infinite}
.buoy-g{animation:bob2 6.5s ease-in-out infinite}
.glow{animation:pulse 7s ease-in-out infinite}
.fogA{animation:driftA 47s ease-in-out infinite}
.fogB{animation:driftB 61s ease-in-out infinite}
.fogC{animation:driftA 83s ease-in-out infinite}
.wisp{animation:wisp 90s linear infinite}
.wisp2{animation:wisp 120s linear infinite;animation-delay:-55s}
.watcher{animation:watch 36s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.island-main,.buoy-g,.glow,.fogA,.fogB,.fogC,.wisp,.wisp2,.watcher{animation:none}}
</style>
</head>

<script>
(function(){
  var INFO = {
    world: {
      name: 'Туманный Архипелаг',
      status: 'туман держит всё, что не поднято',
      cls: 'dark',
      rows: [['машины','5'],['живых','1'],['в тумане','4'],['порты открыто','0']],

      phrase: 'Спит: цепочки автоматизации не заведены — крюк пустой.'
    },

      phrase: 'Туман накрыл: стоит поднять bootstrap — всплывёт.'

    do: {

    vultr: {

      phrase: 'Силуэт еле угадывается — всплывёт, когда понадобится.'
    },
    n100: {
      name: 'Полуостров «Локальный N100»',
      status: 'готовится · под туманом',
      cls: 'dim',
      rows: [['роль','Frigate — камеры'],['тип','локальная машина']],
      phrase: 'Один тёплый огонёк в окне: Frigate готовится выйти из тумана.'
    },
    buoy: {
      name: 'Буй «Сервер дашборда»',
      status: 'loopback-only',

      phrase: 'Смотрит в собственную воду: наружу не светит и не отвечает.'
    },
    watcher: {
      name: 'Дальний огонь в тумане',
      status: 'наблюдает · источник не опознан',
      cls: 'dark',
      rows: [['внешний периметр','0/100 портов открыто'],['источник','не опознан']],
      phrase: 'Пусть смотрит: снаружи не светится ни один порт.'
    }
  };

  var panel = document.getElementById('panel');

  function render(id){
    var d = INFO[id] || INFO.world;
    var rows = '';
    for (var i = 0; i < d.rows.length; i++){
      rows += '<div class="p-row"><span>' + d.rows[i][0] + '</span><b>' + d.rows[i][1] + '</b></div>';
    }
    panel.innerHTML =
      '<div class="p-name">' + d.name + '</div>' +
      '<div class="p-status ' + d.cls + '">' + d.status + '</div>' +
      '<div class="p-rows">' + rows + '</div>' +
      '<div class="p-phrase">«' + d.phrase + '»</div>' +
      '<div class="p-check">проверено · демо-снимок 09.11.2026</div>';
  }

  function clearSel(){
    var s = document.querySelectorAll('.obj.sel');
    for (var i = 0; i < s.length; i++) s[i].classList.remove('sel');
  }

  var objs = document.querySelectorAll('.obj');
  for (var i = 0; i < objs.length; i++){
    objs[i].addEventListener('click', function(ev){
      ev.stopPropagation();
      clearSel();
      this.classList.add('sel');
      render(this.getAttribute('data-id'));
    });
  }

  document.getElementById('scene').addEventListener('click', function(){
    clearSel();
    render('world');
  });

  render('world');
})();
</script>
</body>
</html>
