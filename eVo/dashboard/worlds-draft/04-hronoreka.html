<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Хронорека — превью-вариация</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    background: radial-gradient(ellipse at 50% 38%, #0d1a2b 0%, #0a1420 58%, #081019 100%);
    color:#dfe9f2;
    font-family: system-ui, "Segoe UI", sans-serif;
    overflow:hidden;
  }
  .wrap { max-width:1280px; height:100vh; margin:0 auto; display:flex; flex-direction:column; }

  /* ── шапка ── */
  header {
    flex:0 0 60px; display:flex; align-items:center; gap:18px;
    padding:0 22px; border-bottom:1px solid #17293d;
  }
  .brand h1 { font-size:24px; font-weight:650; letter-spacing:.05em; color:#eaf3fa; line-height:1.1; }
  .status { font-size:10.5px; letter-spacing:.14em; color:#8ea6bc; margin-top:2px; }
  .chips { display:flex; gap:8px; margin-left:auto; }
  .chip {
    border:1px solid #223a52; border-radius:14px; padding:4px 11px;
    display:flex; align-items:baseline; gap:6px; background:#0d1c2c;
  }
  .chip span { font-size:10.5px; color:#8ea6bc; letter-spacing:.06em; }
  .chip b { font-size:13px; color:#eaf3fa; font-variant-numeric:tabular-nums; font-weight:600; }
  .home {
    width:34px; height:34px; border-radius:50%; border:1px solid #2a4258;
    display:flex; align-items:center; justify-content:center;
    color:#9fc2dd; font-size:16px; text-decoration:none; background:#0d1c2c; flex:0 0 auto;
  }
  .home:hover { background:#16304a; color:#dceefb; border-color:#3a5f80; }

  /* ── сцена ── */
  .stage { flex:1 1 auto; position:relative; min-height:0; }
  .stage svg { width:100%; height:100%; display:block; }

  .dlabel { fill:#8ea6bc; font-size:12.5px; letter-spacing:.05em; }
  .dlabel.on { fill:#f2f8fc; }
  .zone { cursor:pointer; }

  .flow { stroke:rgba(226,232,240,.20); fill:none; stroke-width:2; stroke-dasharray:10 34; animation:flow 1.5s linear infinite; }
  .flow2 { stroke:rgba(226,232,240,.12); fill:none; stroke-width:1.6; stroke-dasharray:6 26; animation:flow 1.9s linear infinite; }
  .stormflow { stroke:rgba(226,232,240,.30); fill:none; stroke-width:1.8; stroke-dasharray:5 14; animation:flow .85s linear infinite; }
  @keyframes flow { to { stroke-dashoffset:44; } }

  .foam { fill:#e2e8f0; animation:foam 2.4s ease-in-out infinite; }
  @keyframes foam { 0%,100%{opacity:.9} 50%{opacity:.35} }

  .trib { stroke:#68d391; fill:none; stroke-width:2.4; opacity:.8; }
  .trib.t2 { stroke-width:3; opacity:.9; }
  .mouth { fill:#68d391; opacity:.95; }

  .mark { fill:#f56565; }
  .ring { fill:none; stroke:#f56565; stroke-width:2.5; animation:ring 2.2s ease-out infinite; }
  @keyframes ring { 0%{opacity:.85; stroke-width:3} 100%{opacity:0; stroke-width:.4} }

  .today-dot { fill:#f6ad55; }
  .today-glow { fill:#f6ad55; opacity:.22; animation:glow 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  .today-ring { fill:none; stroke:#f6ad55; stroke-width:1.6; animation:ring 3s ease-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes glow { 0%,100%{opacity:.28; transform:scale(1)} 50%{opacity:.1; transform:scale(.72)} }
  .drift { animation:drift 7s ease-in-out infinite; }
  @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-14px,-4px)} }
  .today-txt { fill:#f6ad55; font-size:11.5px; letter-spacing:.12em; }

  /* ── панель дня ── */
  #panel {
    flex:0 0 140px; display:grid; grid-template-columns:250px 1fr 1.25fr;
    gap:24px; align-items:center; padding:0 26px;
    background:#0c1725; border-top:1px solid #17293d;
  }
  .p-date { font-size:12px; letter-spacing:.16em; color:#f6ad55; font-variant-numeric:tabular-nums; }
  .p-name { font-size:21px; font-weight:650; color:#eef5fb; line-height:1.15; margin-top:3px; }
  .p-tag { font-size:12px; color:#8ea6bc; margin-top:4px; }
  .p-stats { display:flex; flex-wrap:wrap; gap:10px 26px; }
  .st span { display:block; font-size:10.5px; letter-spacing:.08em; color:#8ea6bc; }
  .st b { font-size:19px; font-weight:600; color:#eaf3fa; font-variant-numeric:tabular-nums; }
  .p-events { border-left:1px solid #17293d; padding-left:22px; display:flex; flex-direction:column; gap:6px; }
  .ev { font-size:12.5px; color:#c4d4e3; line-height:1.3; display:flex; gap:9px; align-items:baseline; }
  .ev::before { content:""; flex:0 0 7px; height:7px; border-radius:50%; background:#8ea6bc; position:relative; top:0; }
  .ev.ok::before { background:#68d391; }
  .ev.bad::before { background:#f56565; }
  .ev.warn::before { background:#e2e8f0; }
  .ev.amber::before { background:#f6ad55; }
  .ev.plan::before { background:#8fb7dd; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>Хронорека</h1>
      <div class="status">ПРЕВЬЮ-ВАРИАЦИЯ · демо-снимок 09.11.2026</div>
    </div>
    <div class="chips">
      <div class="chip"><span>дней</span><b>5</b></div>
      <div class="chip"><span>притоков</span><b>~40</b></div>
      <div class="chip"><span>порогов</span><b>3</b></div>
      <div class="chip"><span>штормов</span><b>1</b></div>
    </div>
    <a class="home" href="index.html" title="В каталог вариаций">⌂</a>
  </header>

  <div class="stage">
    <svg viewBox="0 0 1280 520" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Река времени: пять дней недели вдоль русла">
      <defs>
        <linearGradient id="gRiver" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1280" y2="0">
          <stop offset="0" stop-color="#2c7da0"/>
          <stop offset="1" stop-color="#274472"/>
        </linearGradient>
        <clipPath id="clip0"><rect x="0" y="0" width="250" height="520"/></clipPath>
        <clipPath id="clip1"><rect x="250" y="0" width="250" height="520"/></clipPath>
        <clipPath id="clip2"><rect x="500" y="0" width="255" height="520"/></clipPath>
        <clipPath id="clip3"><rect x="755" y="0" width="255" height="520"/></clipPath>
        <clipPath id="clip4"><rect x="1010" y="0" width="270" height="520"/></clipPath>
      </defs>

      <!-- тёмные берега: редкие камни и пунктир троп -->
      <g>
        <circle cx="150" cy="60" r="2" fill="#142840"/>
        <circle cx="340" cy="140" r="2.5" fill="#142840"/>
        <circle cx="620" cy="470" r="2.5" fill="#142840"/>
        <circle cx="880" cy="90" r="2" fill="#142840"/>
        <circle cx="1210" cy="460" r="2.5" fill="#142840"/>
        <path d="M20 100 Q 220 88 430 102 T 860 96 T 1265 104" stroke="#14243a" fill="none" stroke-width="1" stroke-dasharray="2 9"/>
        <path d="M15 452 Q 230 464 450 452 T 880 460 T 1268 450" stroke="#14243a" fill="none" stroke-width="1" stroke-dasharray="2 9"/>
      </g>

      <!-- шторм: широкий растревоженный участок 07.11 -->
      <path d="M 762 362 C 806 388, 836 302, 882 285 C 926 268, 958 356, 1002 380"
            stroke="url(#gRiver)" fill="none" stroke-width="108" opacity=".85" stroke-linecap="round"/>
      <path class="stormflow" d="M 762 362 C 806 388, 836 302, 882 285 C 926 268, 958 356, 1002 380"/>

      <!-- русло: прошлое слева, сегодня справа; вода течёт справа налево -->
      <path id="river" d="M -40 280 C 40 255, 80 228, 125 225 C 180 222, 210 300, 255 330 C 300 360, 335 240, 380 215 C 425 190, 460 300, 505 335 C 550 370, 585 262, 630 250 C 675 238, 715 330, 760 360 C 805 390, 835 300, 880 285 C 925 270, 955 355, 1000 380 C 1045 405, 1075 268, 1120 250 C 1165 232, 1240 330, 1300 320"
            stroke="url(#gRiver)" fill="none" stroke-width="62" stroke-linecap="round"/>
      <path class="flow2" d="M -40 280 C 40 255, 80 228, 125 225 C 180 222, 210 300, 255 330 C 300 360, 335 240, 380 215 C 425 190, 460 300, 505 335 C 550 370, 585 262, 630 250 C 675 238, 715 330, 760 360 C 805 390, 835 300, 880 285 C 925 270, 955 355, 1000 380 C 1045 405, 1075 268, 1120 250 C 1165 232, 1240 330, 1300 320" transform="translate(0,-14)"/>
      <path class="flow"  d="M -40 280 C 40 255, 80 228, 125 225 C 180 222, 210 300, 255 330 C 300 360, 335 240, 380 215 C 425 190, 460 300, 505 335 C 550 370, 585 262, 630 250 C 675 238, 715 330, 760 360 C 805 390, 835 300, 880 285 C 925 270, 955 355, 1000 380 C 1045 405, 1075 268, 1120 250 C 1165 232, 1240 330, 1300 320" transform="translate(0,15)"/>

      <!-- подсветка выбранного дня -->
      <path id="hl" clip-path="url(#clip4)" d="M -40 280 C 40 255, 80 228, 125 225 C 180 222, 210 300, 255 330 C 300 360, 335 240, 380 215 C 425 190, 460 300, 505 335 C 550 370, 585 262, 630 250 C 675 238, 715 330, 760 360 C 805 390, 835 300, 880 285 C 925 270, 955 355, 1000 380 C 1045 405, 1075 268, 1120 250 C 1165 232, 1240 330, 1300 320"
            stroke="#bfe3f2" fill="none" stroke-width="70" opacity=".14" pointer-events="none"/>

      <!-- притоки-коммиты: зелёные ветки впадают в реку -->
      <g>
        <path class="trib" d="M 95 105 Q 106 150 128 198"/><circle class="mouth" cx="128" cy="198" r="3"/>
        <path class="trib" d="M 30 452 Q 34 360 46 284"/><circle class="mouth" cx="46" cy="284" r="3"/>
        <path class="trib" d="M 185 478 Q 192 400 206 324"/><circle class="mouth" cx="206" cy="324" r="3"/>
        <path class="trib t2" d="M 300 96 Q 296 190 300 295"/><circle class="mouth" cx="300" cy="295" r="3.5"/>
        <path class="trib t2" d="M 368 483 Q 360 370 356 284"/><circle class="mouth" cx="356" cy="284" r="3.5"/>
        <path class="trib t2" d="M 448 98 Q 452 180 456 268"/><circle class="mouth" cx="456" cy="268" r="3.5"/>
        <path class="trib t2" d="M 500 480 Q 504 420 506 364"/><circle class="mouth" cx="506" cy="364" r="3.5"/>
        <path class="trib" d="M 548 100 Q 548 210 552 318"/><circle class="mouth" cx="552" cy="318" r="3"/>
        <path class="trib" d="M 660 468 Q 658 370 656 280"/><circle class="mouth" cx="656" cy="280" r="3"/>
        <path class="trib" d="M 728 96 Q 730 200 736 300"/><circle class="mouth" cx="736" cy="300" r="3"/>
        <path class="trib" d="M 802 96 Q 804 200 806 300"/><circle class="mouth" cx="806" cy="300" r="3"/>
        <path class="trib" d="M 906 478 Q 906 410 906 344"/><circle class="mouth" cx="906" cy="344" r="3"/>
        <path class="trib" d="M 988 96 Q 988 210 989 314"/><circle class="mouth" cx="989" cy="314" r="3"/>
        <path class="trib" d="M 1053 500 Q 1056 462 1059 424"/><circle class="mouth" cx="1059" cy="424" r="3"/>
        <path class="trib" d="M 1150 96 Q 1152 160 1153 218"/><circle class="mouth" cx="1153" cy="218" r="3"/>
        <path class="trib" d="M 1246 468 Q 1248 410 1248 352"/><circle class="mouth" cx="1248" cy="352" r="3"/>
      </g>

      <!-- пороги 05.11: два корабля погибли при рестарте -->
      <g>
        <circle class="foam" cx="320" cy="256" r="2.4"/>
        <circle class="foam" cx="330" cy="266" r="2.8" style="animation-delay:.5s"/>
        <circle class="foam" cx="340" cy="255" r="2.2" style="animation-delay:1.1s"/>
        <circle class="foam" cx="327" cy="248" r="2" style="animation-delay:1.7s"/>
        <circle class="foam" cx="336" cy="273" r="2" style="animation-delay:.9s"/>
        <circle class="mark" cx="330" cy="262" r="5.5"/>
        <circle class="ring" cx="330" cy="262" r="6"/>
        <circle class="foam" cx="415" cy="230" r="2.4" style="animation-delay:.7s"/>
        <circle class="foam" cx="426" cy="240" r="2.8" style="animation-delay:1.3s"/>
        <circle class="foam" cx="436" cy="229" r="2.2" style="animation-delay:.2s"/>
        <circle class="foam" cx="422" cy="222" r="2" style="animation-delay:1.9s"/>
        <circle class="foam" cx="433" cy="247" r="2" style="animation-delay:1.5s"/>
        <circle class="mark" cx="426" cy="235" r="5.5"/>
        <circle class="ring" cx="426" cy="235" r="6" style="animation-delay:1s"/>
      </g>

      <!-- порог 06.11: Резюме-конвейер, коллизия test→test -->
      <g>
        <circle class="foam" cx="570" cy="278" r="2.4" style="animation-delay:.3s"/>
        <circle class="foam" cx="580" cy="268" r="2.8" style="animation-delay:1s"/>
        <circle class="foam" cx="592" cy="280" r="2.6" style="animation-delay:1.6s"/>
        <circle class="foam" cx="602" cy="266" r="2.4" style="animation-delay:.6s"/>
        <circle class="foam" cx="612" cy="275" r="2.2" style="animation-delay:2s"/>
        <circle class="foam" cx="586" cy="262" r="2" style="animation-delay:1.3s"/>
        <circle class="mark" cx="591" cy="272" r="6"/>
        <circle class="ring" cx="591" cy="272" r="6.5" style="animation-delay:1.6s"/>
      </g>

      <!-- шторм 07.11: белые гребни -->
      <g>
        <circle class="foam" cx="790" cy="352" r="2.6" style="animation-delay:.4s"/>
        <circle class="foam" cx="826" cy="322" r="3" style="animation-delay:1.2s"/>
        <circle class="foam" cx="862" cy="290" r="2.6" style="animation-delay:.8s"/>
        <circle class="foam" cx="898" cy="286" r="3" style="animation-delay:1.8s"/>
        <circle class="foam" cx="936" cy="306" r="2.6" style="animation-delay:.2s"/>
        <circle class="foam" cx="972" cy="342" r="3" style="animation-delay:1.5s"/>
        <circle class="foam" cx="990" cy="368" r="2.4" style="animation-delay:.9s"/>
        <circle class="foam" cx="810" cy="380" r="2.4" style="animation-delay:2.1s"/>
        <circle class="foam" cx="918" cy="330" r="2.2" style="animation-delay:.6s"/>
      </g>

      <!-- точка «сегодня» -->
      <g class="drift">
        <circle class="today-glow" cx="1163" cy="248" r="17"/>
        <circle class="today-ring" cx="1163" cy="248" r="9"/>
        <circle class="today-dot" cx="1163" cy="248" r="7"/>
        <text class="today-txt" x="1146" y="222">СЕГОДНЯ</text>
      </g>

      <!-- даты на берегах -->
      <g>
        <text class="dlabel" x="48" y="70">04.11 · Тихая долина</text>
        <text class="dlabel" x="252" y="500">05.11 · Ночь конвейера</text>
        <text class="dlabel" x="515" y="70">06.11 · Пороги</text>
        <text class="dlabel" x="770" y="500">07.11 · Шторм</text>
        <text class="dlabel on" x="1035" y="70">08.11 · сегодня</text>
      </g>

      <!-- зоны клика по долинам дней -->
      <g fill="transparent">
        <rect class="zone" data-i="0" x="0"   y="40" width="250" height="460"/>
        <rect class="zone" data-i="1" x="250" y="40" width="250" height="460"/>
        <rect class="zone" data-i="2" x="500" y="40" width="255" height="460"/>
        <rect class="zone" data-i="3" x="755" y="40" width="255" height="460"/>
        <rect class="zone" data-i="4" x="1010" y="40" width="270" height="460"/>
      </g>
    </svg>
  </div>

  <section id="panel">
    <div class="p-left">
      <div class="p-date" id="pDate"></div>
      <div class="p-name" id="pName"></div>
      <div class="p-tag" id="pTag"></div>
    </div>
    <div class="p-stats" id="pStats"></div>
    <div class="p-events" id="pEvents"></div>
  </section>

</div>

<script>
  var DAYS = [
    { date:'04.11', name:'Тихая долина', tag:'ровное течение',
      stats:[['отклики','10'],['выгрузка','216'],['притоки','6']],
      events:[['ok','шли под парусом, вода спокойная']] },
    { date:'05.11', name:'Ночь конвейера', tag:'мощный приток',
      stats:[['лейны','10'],['токены','6,87M'],['притоки','14'],['пороги','2']],
      events:[['ok','конвейер шёл всю ночь'],['bad','2 корабля погибли при рестарте']] },
    { date:'06.11', name:'Пороги', tag:'алая вода',
      stats:[['пороги','1'],['пинальщик','4,5 ч'],['притоки','5']],
      events:[['bad','Резюме-конвейер: коллизия test→test'],
              ['ok','вечером — вердикты'],
              ['plan','решение: свои агенты — 1–2 лейна на ночь']] },
    { date:'07.11', name:'Шторм', tag:'растревоженная вода',
      stats:[['артефакты','21'],['токены','7,1M'],['притоки','11']],
      events:[['warn','страшный челлендж'],
              ['bad','беда с параллельными спавнами (concurrency)'],
              ['ok','фабрика продала 21 артефакт']] },
    { date:'08.11', name:'Сегодня', tag:'Sharp-изгибы',
      stats:[['притоки','4'],['изгибы','3']],
      events:[['amber','Tor-конур'],['amber','Dark Watch'],['amber','верфь миров (этот мир)']] }
  ];

  var sel = 4, hov = -1;
  var hl = document.getElementById('hl');
  var labels = document.querySelectorAll('.dlabel');
  var zones = document.querySelectorAll('.zone');

  function updHl() {
    var i = (hov >= 0) ? hov : sel;
    hl.setAttribute('clip-path', 'url(#clip' + i + ')');
    hl.setAttribute('opacity', (hov >= 0 && hov !== sel) ? '.26' : '.14');
  }

  function render(i) {
    var d = DAYS[i];
    document.getElementById('pDate').textContent = d.date;
    document.getElementById('pName').textContent = d.name;
    document.getElementById('pTag').textContent = d.tag;
    var s = '';
    for (var k = 0; k < d.stats.length; k++) {
      s += '<div class="st"><span>' + d.stats[k][0] + '</span><b>' + d.stats[k][1] + '</b></div>';
    }
    document.getElementById('pStats').innerHTML = s;
    var e = '';
    for (var j = 0; j < d.events.length; j++) {
      e += '<div class="ev ' + d.events[j][0] + '">' + d.events[j][1] + '</div>';
    }
    document.getElementById('pEvents').innerHTML = e;
    for (var m = 0; m < labels.length; m++) {
      if (m === i) { labels[m].classList.add('on'); } else { labels[m].classList.remove('on'); }
    }
  }

  function select(i) { sel = i; updHl(); render(i); }

  for (var z = 0; z < zones.length; z++) {
    (function (node) {
      node.addEventListener('click', function () { select(parseInt(node.getAttribute('data-i'), 10)); });
      node.addEventListener('mouseenter', function () { hov = parseInt(node.getAttribute('data-i'), 10); updHl(); });
      node.addEventListener('mouseleave', function () { hov = -1; updHl(); });
    })(zones[z]);
  }

  updHl();
  render(sel);
</script>
</body>
</html>
