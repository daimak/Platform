<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#0d1512;color:#e8e2d4;font-family:"Segoe UI",system-ui,-apple-system,sans-serif;overflow-x:hidden}
  .wrap{height:100vh;min-height:600px;max-width:1280px;margin:0 auto;padding:0 22px 12px;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid #1c2820}
  .titleblock h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.5px;color:#efe9db}
  .titleblock .acc{color:#f6a04d}
  .status{font-size:11px;color:#8f8674;letter-spacing:1.6px;margin-top:3px}
  .chips{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:flex;align-items:baseline;gap:7px;border:1px solid #26352b;border-radius:999px;padding:5px 12px;background:#101a14}
  .chip i{font-style:normal;font-size:10px;letter-spacing:1.2px;color:#8f8674}
  .chip b{font-size:14px;color:#f6a04d;font-variant-numeric:tabular-nums}
  .home{width:36px;height:36px;border-radius:50%;background:#101a14;border:1px solid #26352b;color:#f6a04d;display:flex;align-items:center;justify-content:center;font-size:17px;text-decoration:none;flex:none}
  .home:hover{background:#18241c;border-color:#3a4a3e}
  main{flex:1;display:flex;min-height:0}
  .scene{flex:1;min-width:0}
  .scene svg{width:100%;height:100%;display:block}
  svg text{font-variant-numeric:tabular-nums}
  .camp{cursor:pointer;outline:none}
  .camp:hover{filter:brightness(1.3)}
  .camp.active{filter:drop-shadow(0 0 7px rgba(246,160,77,.4))}
  .ring{fill:none;stroke:#e6c229;stroke-width:1.5;stroke-dasharray:4 7;opacity:0;transition:opacity .25s}
  .camp:hover .ring{opacity:.4}
  .camp.active .ring,.camp:focus-visible .ring{opacity:.95}
  .halo{animation:pulse 3.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:.95}}
  .tw{animation:tw 3.4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:.9}}
  .fly{transform-box:fill-box;animation:fly 7s ease-in-out infinite}
  @keyframes fly{0%,100%{transform:translate(0,0)}33%{transform:translate(10px,-14px)}66%{transform:translate(-8px,6px)}}
  .panel{width:300px;flex:none;background:#101a14;border-left:1px solid #223128;padding:18px 20px;overflow-y:auto}
  .kind{font-size:10px;letter-spacing:2px;color:#8f8674}
  .panel h2{font-size:17px;line-height:1.35;margin:6px 0 14px;color:#efe9db;font-weight:600}
  .lbl{font-size:10px;letter-spacing:2px;color:#8f8674;margin-top:14px}
  .panel p{margin:4px 0 0;font-size:13.5px;line-height:1.5;color:#cfc8b8}
  .verdict{font-weight:600}
  .v-moved{color:#7fb069}
  .v-live{color:#f6a04d}
  .note{font-size:12px;color:#e6c229;margin-top:6px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .stat{border:1px solid #223128;border-radius:8px;padding:8px 10px}
  .stat b{font-size:22px;font-variant-numeric:tabular-nums;display:block}
  .stat i{font-style:normal;font-size:10px;color:#8f8674;letter-spacing:1px}
  .n-live{color:#7fb069}.n-move{color:#f6a04d}.n-dead{color:#d9534f}
  .gate{list-style:none;margin:6px 0 0;padding:0}
  .gate li{font-size:13px;color:#cfc8b8;padding:5px 0 5px 16px;position:relative;border-top:1px dashed #223128}
  .gate li:first-child{border-top:none}
  .gate li:before{content:"—";position:absolute;left:0;color:#e6c229}
  .flavor{margin-top:16px;font-size:12.5px;color:#8f8674;font-style:italic}
  .meta{margin-top:16px;font-size:12px;color:#8f8674}
  .meta b{color:#e6c229;font-variant-numeric:tabular-nums}
</style>

      idea: "Скупить дюжину облаков за ночь, пока цена спит.",

  };
  var panel = document.getElementById("panel");
  var camps = Array.prototype.slice.call(document.querySelectorAll(".camp"));
  function render(id){
    var o = DATA[id], h = "";
    if (o.report) {
      h = '<div class="kind">РАПОРТ СТОРОЖА</div>'
        + '<h2>Утро 09.11.2026</h2>'
        + '<div class="stats">'
        + '<div class="stat"><b class="n-live">3</b><i>выжило</i></div>'
        + '<div class="stat"><b class="n-move">1</b><i>переехало</i></div>'
        + '<div class="stat"><b class="n-dead">0</b><i>догорело</i></div>'
        + '<div class="stat"><b class="n-dead">0</b><i>в прод попало</i></div>'
        + '</div>'
        + '<div class="lbl">ВРАТА СТРАНЫ</div>'
        + '<ul class="gate"><li>бюджет вылазки ≤ 5M токенов</li><li>запрет продакшена</li><li>рапорт к утру</li></ul>'
        + '<p class="flavor">Каждая вылазка выходит на ночь: бюджет на костёр и право не вернуться.</p>';
    } else {
      h = '<div class="kind">' + o.kind + '</div>'

        + '<div class="lbl">ЧТО ЗАМЫШЛЯЛА</div><p>' + o.idea + '</p>'
        + '<div class="lbl">ЧЕМ КОНЧИЛАСЬ</div><p>' + o.end + '</p>'

        + '<div class="meta">бюджет ночи: <b>' + o.budget + ' токенов</b></div>';
    }
    panel.innerHTML = h;
  }
  function select(id){
    render(id);
    camps.forEach(function(g){ g.classList.toggle("active", g.getAttribute("data-id") === id); });
  }
  camps.forEach(function(g){
    var id = g.getAttribute("data-id");
    g.addEventListener("click", function(){ select(id); });
    g.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(id); }

  });
  select("guard");
})();
