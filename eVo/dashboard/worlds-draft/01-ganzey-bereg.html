<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ганзейский берег · Platform Evo</title>
<style>
  :root{--amber:#f6ad55;--gold:#ecc94b;--fire:#f56565;--paper:#e8dcc4;--sea:#0a1420}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:#081220;color:var(--paper);font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid rgba(246,173,85,.18);background:linear-gradient(180deg,#0c1727,#0a1420)}
  .tblock h1{margin:0;font-size:25px;line-height:1.1;font-weight:600;color:var(--amber);letter-spacing:.01em}
  .tblock .sub{margin-top:3px;font-size:10.5px;letter-spacing:.14em;color:#8fa3ba;text-transform:uppercase}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  .chip{display:flex;align-items:baseline;gap:7px;border:1px solid rgba(143,163,186,.28);border-radius:999px;padding:4px 12px 5px;font-size:11px;color:#8fa3ba;white-space:nowrap}
  .chip b{font-size:13.5px;color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
  .home{margin-left:6px;width:38px;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgba(246,173,85,.45);color:var(--paper);text-decoration:none;font-size:17px;line-height:1;background:rgba(246,173,85,.08);transition:background .15s}
  .home:hover{background:rgba(246,173,85,.22)}
  .stage{position:relative;flex:1;min-height:0}
  .stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;font-family:inherit}
  .lbl{font-size:12px;fill:#a9bacc;letter-spacing:.05em}
  .lbl2{font-size:11px;fill:#8fa3ba;letter-spacing:.06em}
  .obj{cursor:pointer}
  .obj:hover{filter:brightness(1.3)}
  .obj.active{filter:brightness(1.35) drop-shadow(0 0 6px rgba(246,173,85,.55))}
  @keyframes pulseRed{0%,100%{opacity:.4;transform:scale(1)}50%{opacity:.75;transform:scale(1.18)}}
  .glow-red{transform-box:fill-box;transform-origin:center;animation:pulseRed 2.2s ease-in-out infinite}
  @keyframes pulseSoft{0%,100%{opacity:.35}50%{opacity:.7}}
  .glow-soft{transform-box:fill-box;transform-origin:center;animation:pulseSoft 3.4s ease-in-out infinite}
  @keyframes warn{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:.85;transform:scale(1.25)}}
  .glow-warn{transform-box:fill-box;transform-origin:center;animation:warn 1.6s ease-in-out infinite}
  @keyframes dashflow{to{stroke-dashoffset:-72}}
  .windline{stroke-dasharray:14 10;animation:dashflow 3s linear infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .bob{animation:bob 3.8s ease-in-out infinite}
  @keyframes beam{0%,100%{opacity:.55}50%{opacity:1}}
  .beam{animation:beam 5s ease-in-out infinite}
  @keyframes shim{0%,100%{opacity:.12}50%{opacity:.4}}
  .shimmer{animation:shim 3.2s ease-in-out infinite}
  /* --- слой глубины и живости (v2) --- */
  .stage{perspective:1500px;perspective-origin:50% 40%;overflow:hidden}
  .scene{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
  .galleon{position:absolute;left:0;top:0;width:98px;filter:drop-shadow(0 7px 9px rgba(0,0,0,.55));pointer-events:none;will-change:transform}
  .gshadow{position:absolute;left:0;top:0;width:84px;height:13px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),rgba(0,0,0,0));pointer-events:none;will-change:transform}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 42%,rgba(0,0,0,0) 55%,rgba(3,7,12,.5) 100%)}
  @keyframes gullfly{from{transform:translateX(-90px)}to{transform:translateX(1370px)}}
  .gull{animation:gullfly 44s linear infinite}
  .gull2{animation-duration:63s;animation-delay:-31s}
  @keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}
  .gullw{transform-box:fill-box;transform-origin:center;animation:flap .65s ease-in-out infinite}
  .gull2 .gullw{animation-duration:.8s}
  @keyframes sweep{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.6deg)}}
  .sweep{transform-box:view-box;transform-origin:55px 444px;animation:sweep 9s ease-in-out infinite}
  @keyframes cloudDrift{from{transform:translateX(0)}to{transform:translateX(95px)}}
  .drift-a{transform-box:fill-box;animation:cloudDrift 130s linear infinite alternate}
  .drift-b{transform-box:fill-box;animation:cloudDrift 95s linear infinite alternate-reverse}
  @keyframes sunBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  .sunbreathe{transform-box:fill-box;transform-origin:center;animation:sunBreath 7s ease-in-out infinite}
  @keyframes puff{0%{opacity:.45;transform:translate(0,0) scale(.55)}100%{opacity:0;transform:translate(-16px,-36px) scale(1.6)}}
  .puff{transform-box:fill-box;transform-origin:center;animation:puff 4.2s linear infinite}
  @keyframes nearDrift{from{transform:translateX(0)}to{transform:translateX(-320px)}}
  .nearwave{animation:nearDrift 26s linear infinite}
  .nearwave.slow{animation-duration:41s;animation-direction:reverse}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .panel{position:absolute;right:16px;bottom:16px;width:324px;max-width:calc(100vw - 32px);background:var(--paper);color:#241c0e;border-radius:10px;padding:14px 16px 13px;box-shadow:0 14px 36px rgba(0,0,0,.55);border:1px solid rgba(236,201,75,.55)}
  .panel .kind{font-size:10px;letter-spacing:.16em;color:#7a4e20;text-transform:uppercase;font-weight:600}
  .panel h2{margin:3px 0 2px;font-size:17.5px;line-height:1.2;color:#1e1708}
  .panel .pstatus{font-size:12px;color:#5d4c30;margin-bottom:8px}
  .rows .row{display:flex;justify-content:space-between;gap:14px;padding:4px 0;border-bottom:1px dashed rgba(93,76,48,.3);font-size:12.5px}
  .rows .row span{color:#5d4c30}
  .rows .row b{font-weight:600;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;color:#241c0e}
  .panel .phrase{margin:9px 0 0;padding:2px 0 2px 10px;border-left:3px solid var(--amber);font-size:13px;font-style:italic;color:#3a2c14}
  .panel.urgent{border-color:rgba(245,101,101,.75)}
  .panel.urgent .phrase{border-left-color:var(--fire);color:#8f2f2f}
  .panel.urgent .kind{color:#b23c3c}
</style>
</head>
<body>
<header>
  <div class="tblock">
    <h1>Ганзейский берег</h1>
    <div class="sub">ПРЕВЬЮ-ВАРИАЦИЯ · демо-снимок 09.11.2026</div>
  </div>
  <div class="chips">
    <div class="chip"><span>портов</span><b>5</b></div>

  var phraseEl = document.getElementById('p-phrase');

  function show(id){
    var d = DATA[id];
    if(!d) return;
    kindEl.textContent = d.kind;
    nameEl.textContent = d.name;
    statusEl.textContent = d.status;
    var html = '';
    for(var i = 0; i < d.rows.length; i++){
      html += '<div class="row"><span>' + d.rows[i][0] + '</span><b>' + d.rows[i][1] + '</b></div>';
    }
    rowsEl.innerHTML = html;
    phraseEl.textContent = d.phrase;
    panel.classList.toggle('urgent', !!d.urgent);
    var cur = document.querySelectorAll('.obj.active');
    for(var j = 0; j < cur.length; j++){ cur[j].classList.remove('active'); }
    var el = document.querySelector('[data-id="' + id + '"]');
    if(el){ el.classList.add('active'); }
  }

  var objs = document.querySelectorAll('.obj');
  for(var k = 0; k < objs.length; k++){
    (function(node){
      node.addEventListener('click', function(e){
        e.stopPropagation();
        show(node.getAttribute('data-id'));
      });
    })(objs[k]);
  }

  show('window-main');

  /* --- двигатель глубины: параллакс слоёв + галеон-вестник (v2) --- */
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){
    var stage = document.querySelector('.stage');
    var scene = document.getElementById('scene');
    var Lsky = document.getElementById('L-sky');
    var Lsea = document.getElementById('L-sea');
    var Lshore = document.getElementById('L-shore');
    var gal = document.getElementById('galleon');
    var gsh = document.getElementById('gshadow');
    var tx = 0, ty = 0, cx = 0, cy = 0, gx = -180;

    stage.addEventListener('mousemove', function(e){
      var r = stage.getBoundingClientRect();
      tx = (e.clientX - r.left) / r.width - 0.5;
      ty = (e.clientY - r.top) / r.height - 0.5;
    });
    stage.addEventListener('mouseleave', function(){ tx = 0; ty = 0; });

    (function loop(){
      cx += (tx - cx) * 0.055;
      cy += (ty - cy) * 0.055;
      scene.style.transform = 'rotateY(' + (cx * 2.6).toFixed(3) + 'deg) rotateX(' + (-cy * 1.7).toFixed(3) + 'deg) scale(1.07)';
      if(Lsky) Lsky.setAttribute('transform', 'translate(' + (cx * -7).toFixed(1) + ',' + (cy * -3).toFixed(1) + ')');
      if(Lsea) Lsea.setAttribute('transform', 'translate(' + (cx * -16).toFixed(1) + ',' + (cy * -7).toFixed(1) + ')');
      if(Lshore) Lshore.setAttribute('transform', 'translate(' + (cx * -30).toFixed(1) + ',' + (cy * -12).toFixed(1) + ')');
      if(gal){
        gx += 0.5;
        if(gx > 1400) gx = -190;
        var sway = Math.sin(gx / 210);
        var gy = 344 + sway * 18;
        gal.style.transform = 'translate(' + gx.toFixed(1) + 'px,' + gy.toFixed(1) + 'px) rotate(' + (sway * -2.2).toFixed(2) + 'deg) scaleX(-1)';
        if(gsh) gsh.style.transform = 'translate(' + (gx + 16).toFixed(1) + 'px,' + (gy + 64).toFixed(1) + 'px) scaleX(1)';
      }
      requestAnimationFrame(loop);
    })();
  }
})();
