<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eVo — вход</title>
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a1220;--panel:rgba(10,18,36,.86);--line:rgba(94,234,212,.28);--line-dim:rgba(148,163,184,.22);
        --txt:#e2e8f0;--dim:#94a3b8;--acc:#5eead4;--acc2:#7dd3fc;--bad:#fb7185;--ok:#86efac;--mono:'JetBrains Mono',monospace;--disp:'Orbitron',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--txt);font-family:var(--mono);
       background-image:linear-gradient(rgba(94,234,212,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(94,234,212,.04) 1px,transparent 1px);
       background-size:44px 44px}
  .gate{width:min(380px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 26px 20px;
        box-shadow:0 18px 60px rgba(0,0,0,.5);position:relative}
  .gate::before,.gate::after{content:'';position:absolute;width:14px;height:14px;border:1.5px solid var(--acc);opacity:.65}
  .gate::before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
  .gate::after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 14px 0}
  .tag{font-size:.62rem;letter-spacing:.28em;color:var(--acc2);text-transform:uppercase}
  h1{font-family:var(--disp);font-size:1.25rem;letter-spacing:.14em;margin:6px 0 2px;color:#fff}
  .sub{font-size:.66rem;color:var(--dim);letter-spacing:.08em;margin-bottom:16px}
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{flex:1;padding:7px 0;text-align:center;font-size:.68rem;letter-spacing:.14em;cursor:pointer;color:var(--dim);
       border:1px solid var(--line-dim);border-radius:8px;background:transparent;font-family:var(--mono)}
  .tab.sel{color:var(--acc);border-color:var(--line);background:rgba(94,234,212,.07)}
  label{display:block;font-size:.6rem;letter-spacing:.2em;color:var(--dim);margin:12px 0 4px;text-transform:uppercase}
  input{width:100%;padding:9px 11px;background:rgba(0,0,0,.35);border:1px solid var(--line-dim);border-radius:8px;
        color:var(--txt);font-family:var(--mono);font-size:.85rem;outline:none;transition:border-color .15s}
  input:focus{border-color:var(--acc)}
  .row{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.68rem;color:var(--dim)}
  .row input{width:auto}
  button.go{width:100%;margin-top:16px;padding:11px 0;font-family:var(--mono);font-size:.8rem;letter-spacing:.2em;cursor:pointer;
        color:#062b25;background:linear-gradient(180deg,var(--acc),#3ec9b6);border:0;border-radius:9px;font-weight:600}
  button.go:hover{filter:brightness(1.08)}
  button.go:disabled{opacity:.5;cursor:wait}
  .msg{margin-top:12px;font-size:.72rem;min-height:1.1em;line-height:1.45}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)} .msg.dim{color:var(--dim)}
  .foot{margin-top:18px;padding-top:10px;border-top:1px solid rgba(148,163,184,.14);font-size:.6rem;color:var(--dim);
        display:flex;justify-content:space-between;letter-spacing:.1em}
  .blink{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:6px;
         animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
</style>
<link rel="stylesheet" href="themes.css?v=1"><script src="themes-init.js?v=1"></script></head>
<body>
  <div class="gate">
    <div class="tag">eVo · система управления</div>
    <h1>ВХОД</h1>
    <div class="sub"><span class="blink"></span>Дверь активна · соединение проверяется</div>

    <div class="tabs">
      <button class="tab sel" id="tab-login" type="button">ВХОД</button>
      <button class="tab" id="tab-reg" type="button">ЗАЯВКА</button>
    </div>

    <form id="f-login" autocomplete="off">
      <label for="l-login">Логин</label>
      <input id="l-login" name="login" type="text" maxlength="32" required>
      <label for="l-pass">Ключ</label>
      <input id="l-pass" name="password" type="password" required>
      <div class="row"><input id="l-rem" type="checkbox"><span>помнить 7 дней (админ)</span></div>
      <button class="go" type="submit">ВОЙТИ</button>
      <div class="msg dim" id="m-login"></div>
    </form>

    <form id="f-reg" autocomplete="off" hidden>
      <label for="r-login">Логин (a-z, цифры, . _ -)</label>
      <input id="r-login" type="text" maxlength="32" required>
      <label for="r-pass">Ключ (мин. 8)</label>
      <input id="r-pass" type="password" required>
      <label for="r-note">Кто ты и зачем (коротко)</label>
      <input id="r-note" type="text" maxlength="200">
      <button class="go" type="submit">ПОДАТЬ ЗАЯВКУ</button>
      <div class="msg dim" id="m-reg">Заявку одобряет руководитель проекта вручную.</div>
    </form>

    <div class="foot"><span>eVo AUTH · ФАЗА 1</span><span id="who-host">—</span></div>
  </div>

<script>
(function(){
  var tl=document.getElementById('tab-login'), tr=document.getElementById('tab-reg');
  var fl=document.getElementById('f-login'), fr=document.getElementById('f-reg');
  function tab(l){
    tl.classList.toggle('sel', l==='l'); tr.classList.toggle('sel', l!=='l');
    fl.hidden = l!=='l'; fr.hidden = l==='l';
  }
  tl.onclick=function(){tab('l')}; tr.onclick=function(){tab('r')};

  var ip=new URLSearchParams(location.search);
  if(ip.get('invite')) {
    var msgs={missing:'Инвайт не найден: проверь ссылку.', 'bad-signature':'Ссылка повреждена.', unknown:'Ссылка не найдена.',
              revoked:'Ссылка отозвана.', expired:'Ссылка истекла.', exhausted:'Лимит использований ссылки исчерпан.'};
    tab('l');
    var m=document.getElementById('m-login');
    m.className='msg bad';
    m.textContent='Инвайт: '+(msgs[ip.get('invite')]||'ссылка недействительна.');
  }

  fetch('/auth/whoami').then(function(r){return r.json()}).then(function(d){
    if(d.ok){ location.href='command-center.html'; return; }
    document.getElementById('who-host').textContent='SES '+(d.role==='anonymous'?'NONE':d.role.toUpperCase());
  }).catch(function(){ document.getElementById('who-host').textContent='GATE ERR'; });

  document.getElementById('f-login').addEventListener('submit', function(e){
    e.preventDefault();
    var m=document.getElementById('m-login'), b=e.target.querySelector('.go');
    b.disabled=true; m.className='msg dim'; m.textContent='проверка…';
    fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({login:document.getElementById('l-login').value.trim(),
                           password:document.getElementById('l-pass').value,
                           remember:document.getElementById('l-rem').checked})})
    .then(function(r){return r.json().then(function(d){return {s:r.status, d:d}})})
    .then(function(x){
      b.disabled=false;
      if(x.d.ok){ m.className='msg ok'; m.textContent='дверь открыта → перенос…'; setTimeout(function(){location.href='command-center.html'},400); }
      else { m.className='msg bad';
        m.textContent = x.s===429 ? 'слишком много попыток — подожди 15 минут'
                      : x.d.error==='bad-credentials' ? 'неверный логин или ключ'
                      : 'сбой: '+x.d.error; }
    })
    .catch(function(){ b.disabled=false; m.className='msg bad'; m.textContent='сеть недоступна'; });
  });

  document.getElementById('f-reg').addEventListener('submit', function(e){
    e.preventDefault();
    var m=document.getElementById('m-reg'), b=e.target.querySelector('.go');
    var p=document.getElementById('r-pass').value;
    b.disabled=true;
    fetch('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({login:document.getElementById('r-login').value.trim(),
                           password:p, note:document.getElementById('r-note').value})})
    .then(function(r){return r.json().then(function(d){return {s:r.status, d:d}})})
    .then(function(x){
      b.disabled=false;
      if(x.d.ok){ m.className='msg ok'; m.textContent='Заявка принята. Ждёт одобрения руководителя проекта.'; }
      else { m.className='msg bad';
        m.textContent = x.d.error==='exists' ? 'такой логин уже занят/заявка висит'
                      : x.d.error==='invalid-fields' ? 'логин a-z0-9._- (3-32), ключ ≥ 8'
                      : 'сбой: '+x.d.error; }
    })
    .catch(function(){ b.disabled=false; m.className='msg bad'; m.textContent='сеть недоступна'; });
  });
})();
</script>
  <script src="planet.js?v=1"></script>
</body>
</html>
