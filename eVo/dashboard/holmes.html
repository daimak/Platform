<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Холмс — отчёты аудита</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #10141c; color: #d7dde6;
    }
    header {
      padding: 14px 22px; border-bottom: 1px solid #232a36;
      display: flex; align-items: baseline; gap: 14px;
    }
    header h1 { font-size: 18px; margin: 0; letter-spacing: .4px; }
    header a { color: #7fa7d9; font-size: 13px; text-decoration: none; }
    header button {
      margin-left: auto; background: #1c2532; color: #d7dde6; border: 1px solid #2c3646;
      border-radius: 6px; padding: 6px 14px; cursor: pointer; font-size: 13px;
    }
    header button:hover { background: #24303f; }
    #status { padding: 6px 22px; font-size: 12px; color: #8b96a5; }
    #layout { display: flex; flex: 1; min-height: 0; }
    aside {
      width: 300px; border-right: 1px solid #232a36; overflow-y: auto; padding: 10px;
    }
    aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: #8b96a5; margin: 6px 8px; }
    .report-btn {
      display: block; width: 100%; text-align: left; margin: 4px 0; padding: 8px 10px;
      background: #161c26; border: 1px solid #232a36; border-radius: 8px;
      color: #d7dde6; cursor: pointer; font-size: 13px;
    }
    .report-btn:hover { border-color: #3b4a5f; }
    .report-btn.active { border-color: #7fa7d9; }
    .report-btn .meta { display: block; color: #8b96a5; font-size: 11px; margin-top: 3px; }
    main { flex: 1; overflow: auto; padding: 16px 22px; }
    pre {
      white-space: pre-wrap; word-break: break-word; margin: 0;
      font-family: Consolas, "Cascadia Mono", monospace; font-size: 13px; line-height: 1.55;
      color: #cfd7e1;
    }
    .empty { color: #8b96a5; padding: 24px; }
  </style>
</head>
<body>
  <header>
    <h1>🕵️ Холмс — отчёты аудита</h1>
    <a href="/">← Estate</a>
    <button id="reload">Обновить</button>
  </header>
  <div id="status"></div>
  <div id="layout">
    <aside>
      <h2>Прогоны</h2>
      <div id="list"><div class="empty">Загрузка…</div></div>
    </aside>
    <main><pre id="content">—</pre></main>
  </div>
  <script>
    const listEl = document.getElementById("list");
    const contentEl = document.getElementById("content");
    const statusEl = document.getElementById("status");

    async function loadList(selectFile) {
      statusEl.textContent = "Загрузка списка отчётов…";
      const res = await fetch("/api/holmes/reports");
      const data = await res.json();
      if (!res.ok) { statusEl.textContent = "Ошибка: " + (data.error || res.status); return; }
      listEl.innerHTML = "";
      if (!data.reports.length) {
        listEl.innerHTML = '<div class="empty">Отчётов пока нет — запусти Холмса.</div>';
        contentEl.textContent = "—";
        statusEl.textContent = "";
        return;
      }
      for (const rep of data.reports) {
        const btn = document.createElement("button");
        btn.className = "report-btn" + (rep.file === selectFile ? " active" : "");
        btn.textContent = rep.file.replace("-holmes-audit.md", "");
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = "изменён " + rep.modified + " · " + Math.round(rep.size / 1024) + " КБ";
        btn.appendChild(meta);
        btn.addEventListener("click", () => showReport(rep.file));
        listEl.appendChild(btn);
      }
      statusEl.textContent = "Отчётов: " + data.reports.length;
    }

    async function showReport(file) {
      statusEl.textContent = "Загрузка " + file + "…";
      const res = await fetch("/api/holmes/reports?file=" + encodeURIComponent(file));
      const data = await res.json();
      if (!res.ok) { statusEl.textContent = "Ошибка: " + (data.error || res.status); return; }
      contentEl.textContent = data.content;
      statusEl.textContent = file;
      document.querySelectorAll(".report-btn").forEach((b) =>
        b.classList.toggle("active", b.textContent.startsWith(file.replace("-holmes-audit.md", ""))));
    }

    document.getElementById("reload").addEventListener("click", () => loadList().then(showPreferred));

    function showPreferred() {
      return fetch("/api/holmes/reports")
        .then((r) => r.json())
        .then((data) => {
          const wanted = new URLSearchParams(location.search).get("file");
          const target = wanted || (data.latest && data.latest.file);
          if (target) showReport(target);
        });
    }

    loadList().then(showPreferred);
  </script>
</body>
</html>
