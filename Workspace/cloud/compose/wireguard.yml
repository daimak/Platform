# wireguard.yml — туннель к домашней лабе (серверная сторона на облаке).
# Порт: 51820/udp. SERVERURL — плейсхолдер: внешний IP/домен облака, вставить руками
# (или передать через .env, который генерирует deploy-polygons.sh с --serverurl).
services:
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: evo-wireguard
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    ports:
      - "51820:51820/udp"
    volumes:
      - wireguard-config:/config
      - /lib/modules:/lib/modules:ro
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Tashkent
      SERVERURL: "${WG_SERVERURL:?не задан WG_SERVERURL — внешний IP облака}"
      SERVERPORT: "51820"
      PEERS: "homelab-dmitriy"
      PEERDNS: "1.1.1.1"
      ALLOWEDIPS: "0.0.0.0/0"

volumes:
  wireguard-config:
