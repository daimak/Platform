# juice-shop.yml — секьюрити-цель OWASP Juice Shop (СВОЯ, под нашим контролем).
# Порт: 3000 (http://<ip>:3000). Не выставлять на 80/443 без reverse-proxy.
services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: evo-juice-shop
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
