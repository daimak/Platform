# eVo Auth Gate (фаза 1): входная дверь 443 → gate 127.0.0.1:8767.
# Существующие сайты (showcase :80, dashboard-loopback 8766) не тронуты.
# Деплой: 14.11, санкция Дмитрия («го деплой»).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/evo-self.crt;
    ssl_certificate_key /etc/nginx/ssl/evo-self.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8767;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
}
